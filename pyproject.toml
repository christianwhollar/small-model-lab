[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "small-model-lab"
version = "0.2.0"
description = "Pretrained banking intent adaptation, compression, calibration and serving"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "numpy>=2,<3", "torch>=2.6,<3", "scikit-learn>=1.6,<2", "scipy>=1.14,<2", "transformers>=4.57,<5", "safetensors>=0.6,<1"]

[project.optional-dependencies]
research = ["transformers>=4.57,<5", "peft>=0.18,<1", "safetensors>=0.6,<1"]
plots = ["matplotlib>=3.9,<4"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
smallmodel = ["web/*", "resources/*.json", "resources/reports/*"]
